name: Update prices

on:
  schedule:
    # every 15 minutes, 13:00-21:59 UTC, Monday-Friday (covers 9:30am-4pm New York all year).
    # Starts at :03, not :00, because GitHub delays or drops runs most at the top of the hour.
    - cron: "3-59/15 13-21 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data          # never let two jobs write the database at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the database from the data branch
        run: |
          mkdir -p data
          (git fetch origin data --depth=1 && git show origin/data:market.db > data/market.db) || echo "No database yet, starting fresh"

      - name: Fetch prices and yields
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python pipeline/update_prices.py

      - name: Save the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/save_db.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
