name: Update news

on:
  schedule:
    # once an hour at :40 during the trading day, offset from the price job (:03, :18, :33, :48)
    # 13:00-21:59 UTC = about 8am-5pm New York in winter, 9am-6pm in summer
    - cron: "40 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the database from the data branch
        run: |
          mkdir -p data
          (git fetch origin data --depth=1 && git show origin/data:market.db > data/market.db) || echo "No database yet, starting fresh"

      - name: Pick and summarize the day's top stories
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/update_news.py

      - name: Save the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/save_db.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
