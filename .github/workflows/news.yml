name: Update news

# This job only writes stories into the database. It does not publish the site:
# the "Update prices" job publishes every 15 minutes and includes the latest stories.
# Keeping one publisher avoids two jobs fighting over the GitHub Pages deploy.

on:
  schedule:
    # once an hour at :40 during the trading day, offset from the price job (:03, :18, :33, :48)
    # 13:00-21:59 UTC = about 8am-5pm New York in winter, 9am-6pm in summer
    - cron: "40 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the database from the data branch
        run: |
          mkdir -p data
          (git fetch origin data --depth=1 && git show origin/data:market.db > data/market.db) || echo "No database yet, starting fresh"

      - name: Pick and summarize the day's top stories
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/update_news.py

      - name: Save the database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/save_db.sh
